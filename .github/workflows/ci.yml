name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Python smoke
        run: |
          python3 -m py_compile servers/python/crosscheck_server.py
          python3 scripts/smoke_jsonrpc.py python3 servers/python/crosscheck_server.py

      - name: Cache + session offline test
        run: python3 scripts/test_cache_session.py

      - name: Resilience offline test (retries, errors, rate limiter)
        run: python3 scripts/test_resilience.py

      - name: Safety + observability offline test (redaction, allowlist, untrusted, ndjson)
        run: python3 scripts/test_safety.py

      - name: SQLite session + claim-list offline test
        run: python3 scripts/test_db.py

      - name: Schema-first synthesis offline test
        run: python3 scripts/test_structured.py

      - name: Coordinate (Proposer/Critic/Synthesizer) offline test
        run: python3 scripts/test_coordinate.py

      - name: Triangulate (consensus + minority report) offline test
        run: python3 scripts/test_triangulate.py

      - name: Delegate (cross-model handshake + quota) offline test
        run: python3 scripts/test_delegate.py

      - name: Bench (rule-based goldens + win-rate) offline test
        run: python3 scripts/test_bench.py

      - name: Solve (propose -> verify -> retry, sandboxed) offline test
        run: python3 scripts/test_solve.py

      - name: Fetch + claim-DAG (allowlist, sha256 snapshot, dedupe, migration) offline test
        run: python3 scripts/test_fetch_dag.py

      - name: Pick (MCDA + dissent deltas) offline test
        run: python3 scripts/test_pick.py

      - name: Scoreboard + solve patch-preview offline test
        run: python3 scripts/test_scoreboard_patch.py
