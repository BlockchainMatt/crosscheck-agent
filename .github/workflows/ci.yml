name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Python smoke
        run: |
          python3 -m py_compile servers/python/crosscheck_server.py
          python3 scripts/smoke_jsonrpc.py python3 servers/python/crosscheck_server.py
